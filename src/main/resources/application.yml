server:
  port: 8080

spring:
  profiles:
    active: h2

  mvc:
    throw-exception-if-no-handler-found: true
    web:
      resources:
        add-mappings: false
  jackson:
    property-naming-strategy: SNAKE_CASE

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${clerk.issuer}/.well-known/jwks.json

  datasource:
    url: jdbc:h2:file:./data/smartgymdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  api-docs:
    path: /v3/api-docs

clerk:
  # Instancia de Clerk que emite los session tokens (JWT). Se puede sobreescribir con CLERK_ISSUER.
  issuer: https://brave-sawfish-4330.clerk.accounts.dev
  # Clave secreta de la API de backend de Clerk (solo para invitar entrenadores). NUNCA en el repo: variable de entorno CLERK_SECRET_KEY.
  # Vacía = las invitaciones se omiten (el alta del entrenador funciona igual; invitation.status = SKIPPED).
  secret-key: ${CLERK_SECRET_KEY:}
  api-base: https://api.clerk.com
  # A donde llega el entrenador al aceptar la invitación. Se puede sobreescribir con CLERK_INVITATION_REDIRECT_URL.
  invitation-redirect-url: ${CLERK_INVITATION_REDIRECT_URL:http://localhost:4200/auth/sign-up}

smartgym:
  cors:
    # Origenes permitidos separados por coma. Se puede sobreescribir con SMARTGYM_CORS_ALLOWED_ORIGINS.
    allowed-origins: http://localhost:4200

scalar:
  enabled: true
  path: /docs
  url: /v3/api-docs